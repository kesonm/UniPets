location = /pet {
    alias /var/www/petcloud-admin/current/index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
}

location = /pet/ {
    return 308 /pet$is_args$args;
}

location ^~ /pet/assets/ {
    alias /var/www/petcloud-admin/current/assets/;
    add_header X-Content-Type-Options nosniff always;
}

location ~ ^/pet/api/(admin/[a-zA-Z0-9/_-]+|auth/logout)$ {
    if ($http_origin !~ "^(https://canyin\.uniwork\.top)?$") { return 403; }
    rewrite ^/pet(/api/.*)$ $1 break;
    proxy_pass http://127.0.0.1:13000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-PetCloud-Peer $remote_addr;
    proxy_set_header X-PetCloud-Client web;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "petcloud_session=$cookie_petcloud_session";
    proxy_cookie_path / /pet/;
    proxy_cookie_flags petcloud_session secure httponly samesite=strict;
}

location /pet/ {
    return 404;
}

name: petcloud

services:
  db:
    image: public.ecr.aws/docker/library/mysql:8.4
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=96M", "--performance-schema=OFF", "--max-connections=30"]
    environment:
      MYSQL_DATABASE: petcloud
      MYSQL_USER: petcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "--protocol=tcp", "-h", "127.0.0.1", "--silent", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24

  api:
    image: petcloud-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ../.runtime.env
        format: raw
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3008"
      TRUST_PROXY: "1"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?set FRONTEND_ORIGINS in .env}
      PETCLOUD_ALLOW_HTTP_AUTH: "${PETCLOUD_ALLOW_HTTP_AUTH:-0}"
      PETCLOUD_GENERATION_ENABLED: "0"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: petcloud
      DB_USER: petcloud
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      STORAGE_DIR: /var/lib/petcloud/storage
      PET_NOSEPRINT_MODEL_DIR: /var/lib/petcloud/noseprint-models
      PETCLOUD_VIDEO_MATTING: "off"
    volumes:
      - ../storage:/var/lib/petcloud/storage
      - ../noseprint-models:/var/lib/petcloud/noseprint-models:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3008/api/health').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 10s
      timeout: 4s
      retries: 10

  web:
    image: public.ecr.aws/docker/library/caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PETCLOUD_PUBLIC_BIND:-127.0.0.1:13001}:8080"
      - "127.0.0.1:13000:8081"
    volumes:
      - ../dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 8

volumes:
  mysql:
